<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c142c" />
      <stop offset="50%" stop-color="#14101e" />
      <stop offset="100%" stop-color="#0a0710" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f5c451" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(167, 139, 250, 0.35)" />
      <stop offset="100%" stop-color="rgba(167, 139, 250, 0)" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="108" fill="url(#glow)" />
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.5" />

  <!-- Cinema Projector / Beam Arc -->
  <path d="M120 160 Q256 120 392 160" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Screen Frame -->
  <rect x="116" y="170" width="280" height="175" rx="20" fill="#0f0b18" stroke="url(#goldGrad)" stroke-width="10" />

  <!-- Film Strip Top Border inside screen -->
  <path d="M136 195 L376 195" stroke="#7c3aed" stroke-width="4" stroke-dasharray="16 10" />
  <path d="M136 320 L376 320" stroke="#7c3aed" stroke-width="4" stroke-dasharray="16 10" />

  <!-- Center Magical Cinema Symbol (Play + Star Sparkle) -->
  <polygon points="230,225 310,257 230,290" fill="url(#goldGrad)" />

  <!-- Magical Sparkle Top Right -->
  <path d="M375 140 Q375 165 390 165 Q375 165 375 190 Q375 165 360 165 Q375 165 375 140 Z" fill="url(#goldGrad)" />
  <circle cx="410" cy="180" r="4" fill="#fde047" />

  <!-- Magical Sparkle Bottom Left -->
  <path d="M130 345 Q130 360 140 360 Q130 360 130 375 Q130 360 120 360 Q130 360 130 345 Z" fill="url(#purpleGrad)" />

  <!-- Cinema Brand Initials "PM" Bottom -->
  <text x="256" y="420" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#f5c451" text-anchor="middle" letter-spacing="4">PANTALLA MÁGICA</text>
  <text x="256" y="450" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#a78bfa" text-anchor="middle" letter-spacing="6">CINEMA</text>
</svg>