<div class="estructura-administrador">
  <header class="barra-superior">
    <div class="barra-superior__seccion-marca">
      <div class="marca">
        <span class="marca__nombre">
          Pantalla Mágica
        </span>
        <span class="marca__area">
          Administración
        </span>
      </div>

      <nav class="navegacion">
        <a
          routerLink="/admin"
          routerLinkActive="navegacion__enlace--activo"
          [routerLinkActiveOptions]="{ exact: true }"
          class="navegacion__enlace"
        >
          Dashboard
        </a>

        <a
          routerLink="/admin/peliculas"
          routerLinkActive="navegacion__enlace--activo"
          class="navegacion__enlace"
        >
          Películas
        </a>
        <a
          routerLink="/admin/salas"
          routerLinkActive="navegacion__enlace--activo"
          class="navegacion__enlace"
        >
          Salas
        </a>
        <a
          routerLink="/admin/funciones"
          routerLinkActive="navegacion__enlace--activo"
          class="navegacion__enlace"
        >
          Funciones
        </a>
        <a
          routerLink="/admin/tarifas"
          routerLinkActive="navegacion__enlace--activo"
          class="navegacion__enlace"
        >
          Tarifas
        </a>
        <a
          routerLink="/"
          routerLinkActive="navegacion__enlace--activo"
          class="navegacion__enlace"
        >
          Vista cliente
        </a>
      </nav>
    </div>

    <div class="barra-superior__seccion-usuario">
      <div class="datos-usuario">
        <span class="datos-usuario__nombre">
          {{ perfil()?.nombre ? (perfil()?.nombre + ' ' + perfil()?.apellido) : (usuario()?.email ?? 'Administrador') }}
        </span>
        <span class="datos-usuario__etiqueta-rol">
          {{ perfil()?.rol ?? 'admin' }}
        </span>
      </div>

      <button
        type="button"
        class="boton-cerrar-sesion"
        (click)="cerrarSesion()"
      >
        Cerrar sesión
      </button>
    </div>
  </header>

  <main class="contenido-administrador">
    <router-outlet />
  </main>
</div>
